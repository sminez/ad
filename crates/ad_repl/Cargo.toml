[package]
name = "ad_repl"
version = "0.5.0"
edition = "2024"
authors = ["sminez <innes.andersonmorrison@gmail.com>"]
license = "MIT"
repository = "https://github.com/sminez/ad/tree/develop/crates/ad_repl"
documentation = "https://docs.rs/ad_repl"
readme = "README.md"
description = "A simple shell repl for the ad text editor"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md"
]
keywords = [ "terminal", "editor", "text-editor", ]
categories = [ "development-tools", "text-editors", "command-line-utilities" ]

[[bin]]
doc = false
name = "ad-repl"
path = "src/main.rs"

[dependencies]
ad_client = { version = "0.5", path = "../ad_client" }
anyhow = "1.0.100"
subprocess = "0.2.9"
