[package]
name = "ninep"
version = "0.6.0"
edition = "2024"
authors = ["sminez <innes.andersonmorrison@gmail.com>"]
license = "MIT"
repository = "https://github.com/sminez/ad/tree/develop/crates/ninep"
readme = "README.md"
description = "A bare bones 9p implementation"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md"
]

[features]
default = ["tokio", "util_fs"]
tokio = ["dep:tokio"]
util_fs = ["dep:uzers"]

[dependencies]
bitflags = "2"
jiff = "0.2"
simple_coro = "0.1.5"
tokio =  { version = "1", features = ["macros", "net", "io-util", "rt", "sync"], optional = true }
uzers = { version = "0.12", optional = true }

[dev-dependencies]
assert_fs = "1.1"
lexopt = "0.3.2"
simple_test_case = "1"
tokio =  { version = "1", features = ["macros", "net", "io-util", "rt", "sync", "time", "rt-multi-thread", "net", "io-util"] }
