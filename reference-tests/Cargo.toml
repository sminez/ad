[package]
name = "reference-tests"
version = "0.1.0"
edition = "2024"

[workspace]

# We need to enable optimizations for these tests to run in a reasonable amount of time
[profile.dev]
opt-level = 3

[dependencies]
ad-editor = { path = "../" }
libflate = "2.1.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[dev-dependencies]
pretty_assertions = "1.4.1"
