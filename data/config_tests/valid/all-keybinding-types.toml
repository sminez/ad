"X" = { send_keys = "a 1 A-b C-c C-A-d <backspace> <delete> <end> <esc> <home> <page-up> <page-down> <space> <tab> <left> <right> <up> <down>" }

[filetypes.rust]
extensions = ["rs"]
lsp.command = "rust-analyzer"
lsp.roots = ["Cargo.toml"]
